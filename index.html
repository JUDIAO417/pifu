<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>乌龙茶的皮肤小屋</title>
<script src="skinview3d.bundle.js"></script>
<style>
:root{
  --bg1:#e9e2d8; --bg2:#d9d2c8;
  --glass:rgba(255,255,255,.55); --glass-bd:rgba(255,255,255,.7);
  --ink:#4a4238; --ink-soft:#8a8072; --ink-faint:#a89f92;
  --accent:#d97e3f; --accent2:#b96a2f;
  --ok:#4f8f6f; --blue:#5f8fbb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  padding:28px 18px 60px;
}
.wrap{max-width:1180px;margin:0 auto}
/* 头部 */
header{
  display:flex;align-items:center;gap:14px;margin-bottom:22px;
}
header .logo{
  width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;
  box-shadow:0 8px 20px rgba(0,0,0,.14);
}
header .logo img{width:100%;height:100%;object-fit:cover;display:block}
header h1{font-size:24px;font-weight:800;letter-spacing:.5px}
header p{font-size:13px;color:var(--ink-soft);margin-top:3px}
/* 选择器 / 命令区 */
.sel{
  background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);
  border-radius:12px;padding:9px 14px;font-size:13px;color:var(--ink);cursor:pointer;outline:none;
}
.radios{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.radios label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-soft)}
.radios input{accent-color:var(--accent)}
.cmdbox{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:10px 12px;
}
.cmdbox code{
  flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:13px;color:var(--ink);word-break:break-all;line-height:1.5;
}
.cmdmeta{font-size:12px;color:var(--ink-soft);margin-top:6px}
.cmdretry{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:12.5px}
.link{color:var(--blue);text-decoration:none}
.link:hover{text-decoration:underline}
/* 统计条 */
.bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;
}
.bar .stat{
  background:var(--glass);border:1px solid var(--glass-bd);backdrop-filter:blur(14px);
  border-radius:14px;padding:8px 16px;font-size:13px;color:var(--ink-soft);
}
.bar .stat b{color:var(--ink);font-size:16px;margin-right:4px}
.tabs{
  display:flex;gap:6px;background:var(--glass);border:1px solid var(--glass-bd);
  border-radius:14px;padding:4px;backdrop-filter:blur(14px);
}
.tab{
  border:none;background:transparent;padding:8px 16px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .18s;
}
.tab.active{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:0 4px 10px rgba(80,66,50,.12)}
.tab:hover{color:var(--ink)}
.btn{
  display:inline-block;border:none;cursor:pointer;color:#fff;
  background:linear-gradient(160deg,var(--accent),var(--accent2));
  padding:11px 22px;border-radius:14px;font-size:14px;font-weight:700;
  letter-spacing:.5px;box-shadow:0 8px 18px rgba(217,126,63,.35);
  transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(217,126,63,.4)}
.btn:active{transform:translateY(0)}
.btn.ghost{
  background:var(--glass);color:var(--ink);border:1px solid var(--glass-bd);
  box-shadow:none;backdrop-filter:blur(14px);font-weight:600;
}
.btn.small{padding:7px 13px;font-size:12.5px;border-radius:10px}
.btn.blue{background:linear-gradient(160deg,#5f8fbb,#3f6f96);box-shadow:0 8px 18px rgba(95,143,187,.3)}
.btn.danger{background:linear-gradient(160deg,#c96a5f,#a4483e);box-shadow:0 8px 18px rgba(201,106,95,.3)}
.btn.danger:hover{box-shadow:0 12px 24px rgba(201,106,95,.4)}
.stbadge{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;user-select:none;transition:filter .2s}
.stbadge.off{color:#a8a29e;background:rgba(120,113,108,.1);border-color:rgba(120,113,108,.28)}
.stbadge.on{color:#16a34a;background:rgba(22,163,74,.13);border-color:rgba(22,163,74,.38)}
.stbadge:hover{filter:brightness(1.15)}
.gbadge{
  display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;
  font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;user-select:none;
  color:#8a5a2b;background:rgba(217,126,63,.12);border-color:rgba(217,126,63,.35);transition:filter .2s;
}
.gbadge:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn.blue:hover{box-shadow:0 12px 24px rgba(95,143,187,.4)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
/* 加载条 */
#loadbar{
  position:fixed;top:0;left:0;right:0;height:3px;z-index:99;
  background:linear-gradient(90deg,var(--accent),#f2c68a);
  opacity:0;transition:opacity .2s;
}
#loadbar.show{opacity:1}
/* 错误框 */
#apiErr{
  display:none;margin-bottom:16px;padding:12px 16px;border-radius:12px;
  background:rgba(196,118,107,.14);border:1px solid rgba(196,118,107,.35);
  color:#96493f;font-size:13px;
}
#apiErr.show{display:block}
/* 皮肤网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{
  background:var(--glass);border:1px solid var(--glass-bd);border-radius:18px;
  overflow:hidden;cursor:pointer;backdrop-filter:blur(14px);
  box-shadow:0 10px 26px rgba(80,66,50,.12);
  transition:transform .18s,box-shadow .18s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(80,66,50,.2)}
.card .ph{position:relative;aspect-ratio:1/1;background:#f0ece4;overflow:hidden}
.card .ph canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1;background:#4a4a4a}
.card .ph canvas:active{cursor:grabbing}
.card .ph .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated;z-index:0;-webkit-user-drag:none;user-select:none}
.card .ph canvas{-webkit-user-drag:none;user-select:none}
.card .ph .badge,.card .ph .hint{z-index:2}
.card .ph .badge{
  position:absolute;right:8px;top:8px;font-size:11px;padding:3px 10px;border-radius:99px;
  background:rgba(0,0,0,.5);color:#fff;
}
.card .ph .hint{
  position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;
  background:rgba(0,0,0,.45);padding:2px 8px;border-radius:99px;pointer-events:none;
}
.card .meta{padding:12px 14px 6px}
.card .ops{padding:8px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .ops .btn{width:100%;text-align:center;padding:8px 6px;font-size:12.5px;min-width:0}
/* 手机端：操作按钮更大，点击区域更充足 */
@media (max-width:600px){
  .card .ops{padding-top:6px}
  .card .ops .btn{padding:10px 6px}
  .card .meta{padding:12px 14px 4px}
  .bar{gap:10px}
  header h1{font-size:20px}
  .tab{padding:8px 12px;font-size:12.5px}
}
.card .meta .nm{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta .nm span{color:var(--ink-soft);font-weight:500}
.card .meta .tm{font-size:11.5px;color:var(--ink-faint);margin-top:5px}
#empty{
  display:none;text-align:center;padding:70px 20px;color:var(--ink-soft);
  background:var(--glass);border:1px solid var(--glass-bd);border-radius:18px;backdrop-filter:blur(14px);
}
#empty.show{display:block}
#empty .big{font-size:40px;margin-bottom:10px;opacity:.5}
/* 弹窗通用 */
.mask{
  position:fixed;inset:0;background:rgba(40,34,26,.45);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.mask.show{display:flex}
.panel{
  background:#f6f1ea;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.3);
  width:min(560px,94vw);max-height:92vh;overflow:auto;padding:24px;
}
.panel h3{font-size:18px;margin-bottom:16px}
.panel .close{
  float:right;border:none;background:none;font-size:22px;color:var(--ink-soft);
  cursor:pointer;line-height:1;padding:4px;
}
.panel .close:hover{color:var(--ink)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600}
.field input[type=text]{
  width:100%;padding:11px 14px;border-radius:12px;border:1px solid rgba(0,0,0,.12);
  background:#fff;font-size:14px;color:var(--ink);outline:none;
}
.field input[type=text]:focus{border-color:var(--accent)}
.filebox{
  border:2px dashed rgba(0,0,0,.18);border-radius:14px;padding:26px;text-align:center;
  color:var(--ink-soft);font-size:13px;cursor:pointer;transition:border-color .2s;
}
.filebox:hover{border-color:var(--accent)}
.filebox input{display:none}
.filebox .pick{color:var(--accent);font-weight:700}
#upPreview{
  display:none;margin-top:12px;text-align:center;
}
#upPreview img{
  width:128px;height:128px;border-radius:10px;image-rendering:pixelated;
  border:1px solid rgba(0,0,0,.1);background:#fff;
}
#upPreview .info{margin-top:6px;font-size:12px;color:var(--ink-soft)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.row .btn{flex:none}
/* toast */
.toast{
  display:none;position:fixed;left:50%;bottom:34px;transform:translateX(-50%);
  background:rgba(60,50,40,.92);color:#fff;padding:11px 22px;border-radius:99px;
  font-size:13.5px;z-index:100;box-shadow:0 10px 26px rgba(0,0,0,.25);
  max-width:86vw;text-align:center;
}
.toast.err{background:rgba(150,73,63,.94)}
footer{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:34px}
</style>
</head>
<body>

<div id="loadbar"></div>
<div class="wrap">

  <header>
    <div class="logo" id="logoBox"></div>
    <div>
      <h1>乌龙茶的皮肤小屋</h1>
    </div>
  </header>

  <div class="bar">
    <span class="stat"><b id="skinCount">0</b>个皮肤</span>
    <div class="tabs" id="groupTabs">
      <button class="tab" data-tab="all">全部</button>
      <button class="tab active" data-tab="player">玩家皮肤征集</button>
      <button class="tab" data-tab="cos">服务器cos皮肤</button>
    </div>
    <button class="btn" id="openUploadBtn">＋ 上传皮肤</button>
    <button class="btn ghost" id="refreshBtn">刷新列表</button>
    <select class="sel" id="animSel" title="预览动画">
      <option value="idle">动画：空闲</option>
      <option value="walk">动画：行走</option>
      <option value="run">动画：跑步</option>
      <option value="crouch">动画：蹲下</option>
    </select>
  </div>

  <div id="apiErr"></div>
  <div class="grid" id="skinGrid"></div>
  <div id="empty"><div class="big">📮</div><p>玩家皮肤征集群还没有皮肤，点上方「上传皮肤」投一个吧</p></div>

  <footer>乌龙茶的皮肤小屋</footer>
</div>

<!-- 调整分组弹窗 -->
<div class="mask" id="maskGrp">
  <div class="panel" style="width:min(420px,94vw)">
    <button class="close" data-close="maskGrp">&times;</button>
    <h3>调整分组</h3>
    <div class="field">
      <label id="grpSkinName">皮肤</label>
      <select class="sel" id="grpSelect" style="width:100%">
        <option value="">未分组</option>
        <option value="玩家皮肤征集">玩家皮肤征集</option>
        <option value="服务器cos皮肤">服务器cos皮肤</option>
      </select>
    </div>
    <div class="row">
      <button class="btn ghost" data-close="maskGrp">取消</button>
      <button class="btn" id="grpConfirm">保存</button>
    </div>
  </div>
</div>

<!-- 上传弹窗 -->
<div class="mask" id="maskUpload">
  <div class="panel">
    <button class="close" data-close="maskUpload">&times;</button>
    <h3>上传皮肤</h3>
    <div class="field">
      <label>皮肤文件（PNG，64×64 或 64×32）</label>
      <div class="filebox" id="fileBox">点击选择文件<br><span class="pick">选择 PNG 文件</span><input type="file" id="fileInput" accept="image/png"></div>
      <div id="upPreview"><img id="upPreviewImg" alt=""><div class="info" id="upPreviewInfo"></div></div>
    </div>
    <div class="field">
      <label>皮肤类型</label>
      <div class="radios">
        <label><input type="radio" name="upVariant" value="classic" checked> Classic（4px 宽手臂）</label>
        <label><input type="radio" name="upVariant" value="slim"> Slim（3px 细手臂）</label>
      </div>
    </div>
    <div class="field">
      <label>所属分组</label>
      <select class="sel" id="upGroup" style="width:100%">
        <option value="玩家皮肤征集">玩家皮肤征集</option>
        <option value="服务器cos皮肤">服务器cos皮肤</option>
        <option value="">未分组</option>
      </select>
    </div>
    <div class="field">
      <label>皮肤名字</label>
      <input type="text" id="upName" maxlength="30" placeholder="">
    </div>
    <div class="field">
      <label>上传人</label>
      <input type="text" id="upUploader" maxlength="30" placeholder="">
    </div>
    <div class="field" id="cmdWrap" style="display:none">
      <label>服务器换肤命令（SkinsRestorer，自动生成）</label>
      <div class="cmdbox">
        <code id="cmdText">正在生成…</code>
        <button class="btn small blue" id="cmdCopy" disabled>复制命令</button>
      </div>
      <div class="cmdmeta" id="cmdMeta"></div>
      <div class="cmdretry" id="cmdRetry" style="display:none">
        <button class="btn small ghost" id="cmdRetryBtn">重新生成</button>
        <a class="link" href="https://skinsrestorer.net/upload" target="_blank" rel="noopener">手动前往 SkinsRestorer 上传</a>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" data-close="maskUpload" id="upClose">完成</button>
      <button class="btn" id="upConfirm">确认上传</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 配置 ===== */
/* GitHub 写入令牌：拆段拼接存放，避免触发 GitHub 仓库的 secret 扫描拦截。
   如需更换令牌，请把下面两段字符串替换成新令牌的对应部分，然后重新推送。 */
var TOKEN = ["ghp_", "V1W0JT2ershcPopuN3xTUR47axvdsK1sqiuy"].join("");
var GH = {
  owner: "JUDIAO417",
  repo: "pifu",
  branch: "main",
  api: "https://api.github.com",
  raw: function(path){
    return "https://raw.githubusercontent.com/" + this.owner + "/" + this.repo + "/" + this.branch + "/" + path;
  },
  headers: function(){
    return { "Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json" };
  },
  readData: function(){
    var self = this;
    return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", { headers: this.headers() })
      .then(function(res){
        if(res.status === 404) return { data: { skins: [], updatedAt: 0 }, sha: null };
        return res.json().then(function(j){
          if(j.content){
            var data = JSON.parse(decodeURIComponent(escape(atob(j.content))));
            if(!data.skins) data.skins = [];
            return { data: data, sha: j.sha };
          }
          throw new Error(j.message || "读取数据失败");
        });
      });
  },
  delSkin: function(name){
    var self = this;
    var path = "skins/" + encodeURIComponent(name);
    return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/" + path, { headers: this.headers() })
      .then(function(res){
        if(res.status === 404) return null;
        return res.json();
      })
      .then(function(j){
        if(!j) return null;
        return fetch(self.api + "/repos/" + self.owner + "/" + self.repo + "/contents/" + path, {
          method: "DELETE",
          headers: self.headers(),
          body: JSON.stringify({ message: "delete skin", sha: j.sha })
        }).then(function(res){
          if(!res.ok) return res.json().then(function(j2){ throw new Error(j2.message || "删除失败"); });
          return res.json();
        });
      });
  },
  writeData: function(data, sha){
    var body = {
      message: "update data",
      content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
      branch: this.branch
    };
    if(sha) body.sha = sha;
    return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/data.json", {
      method: "PUT",
      headers: this.headers(),
      body: JSON.stringify(body)
    }).then(function(res){
      if(res.status === 409){
        var err = new Error("数据冲突，请重试");
        err.conflict = true;
        throw err;
      }
      if(!res.ok){
        return res.json().then(function(j){ throw new Error(j.message || "写入失败"); });
      }
      return res.json().then(function(j){ return { sha: j.content.sha }; });
    });
  },
  putSkin: function(name, base64){
    var self = this;
    var path = "skins/" + name;
    return fetch(this.api + "/repos/" + this.owner + "/" + this.repo + "/contents/" + path, { headers: this.headers() })
      .then(function(res){
        if(res.status === 404) return null;
        return res.json();
      })
      .then(function(file){
        var body = { message: "upload " + name, content: base64, branch: self.branch };
        if(file && file.sha) body.sha = file.sha;
        return fetch(self.api + "/repos/" + self.owner + "/" + self.repo + "/contents/" + path, {
          method: "PUT",
          headers: self.headers(),
          body: JSON.stringify(body)
        }).then(function(r){ return r.json(); });
      });
  }
};

var state = { data: null, sha: null, _cb: 0 };
var pendingFile = null, pendingDim = null, pendingRawUrl = null;

function showLoad(on){ document.getElementById("loadbar").classList.toggle("show", !!on); }
function showErr(msg){
  var el = document.getElementById("apiErr");
  if(msg){ el.textContent = msg; el.classList.add("show"); }
  else el.classList.remove("show");
}
function toast(msg, isErr){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (isErr ? " err" : "");
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.style.display = "none"; }, 3200);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function fmtTime(ts){
  if(!ts) return "-";
  var d = new Date(ts);
  function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text);
  }
  return new Promise(function(resolve, reject){
    try{
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      resolve();
    }catch(e){ reject(e); }
  });
}

/* ===== 数据加载 ===== */
function loadData(quiet){
  if(!quiet) showLoad(true);
  return GH.readData().then(function(res){
    state.data = res.data;
    state.sha = res.sha;
    if(!quiet){ showLoad(false); showErr(""); }
    renderGrid();
  }).catch(function(err){
    if(!quiet){ showLoad(false); showErr("数据加载失败：" + err.message + "（请检查网络与令牌权限）"); }
    console.error(err);
  });
}
function saveWithRetry(attempt){
  return GH.writeData(state.data, state.sha).then(function(res){
    state.sha = res.sha;
  }).catch(function(err){
    if(err.conflict && attempt < 2){
      return loadData(true).then(function(){ return saveWithRetry(attempt + 1); });
    }
    throw err;
  });
}

/* ===== 列表渲染 ===== */
var GROUP_PLAYER = "玩家皮肤征集";  /* 玩家皮肤征集群名称 */
var GROUP_COS = "服务器cos皮肤";      /* 服务器 cos 皮肤分组名称 */
var activeTab = "player";              /* 默认进入玩家皮肤征集分组 */
/* 分组名 -> tab id */
function tabOfGroup(g){
  if(g === GROUP_PLAYER) return "player";
  if(g === GROUP_COS) return "cos";
  return "all";
}
/* 分组名显示：空值显示为未分组 */
function grpName(g){ return g || "未分组"; }
/* tab id -> 分组名（all 返回 null 表示不过滤） */
function groupOfTab(t){
  if(t === "player") return GROUP_PLAYER;
  if(t === "cos") return GROUP_COS;
  return null;
}

function renderGrid(){
  var all = state.data ? state.data.skins || [] : [];
  all.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  var gname = groupOfTab(activeTab);
  var list = gname ? all.filter(function(r){ return (r.group || "") === gname; }) : all;
  document.getElementById("skinCount").textContent = list.length;
  var grid = document.getElementById("skinGrid");
  var empty = document.getElementById("empty");
  disposeAllRenderers();
  if(list.length === 0){
    grid.innerHTML = "";
    empty.querySelector(".big").textContent = activeTab === "player" ? "📮" : activeTab === "cos" ? "🎭" : "🧊";
    empty.querySelector("p").textContent = activeTab === "player"
      ? "玩家皮肤征集群还没有皮肤，点上方「上传皮肤」投一个吧"
      : activeTab === "cos"
        ? "服务器cos皮肤分组还没有皮肤，点上方「上传皮肤」添加一个吧"
        : "还没有皮肤，点上方「上传皮肤」添加第一个吧";
    empty.classList.add("show");
    return;
  }
  empty.classList.remove("show");
  var html = "";
  list.forEach(function(r){
    html += cardHtml(r);
  });
  grid.innerHTML = html;
  observeCards();
}
function cardHtml(r){
  var clean = GH.raw("skins/" + encodeURIComponent(r.file));
  return '<div class="card" data-skin="' + esc(r.id) + '">'
    + '<div class="ph"><canvas data-url="' + clean + '"></canvas>'
    + '<img class="fallback" data-src="' + clean + '" alt="" draggable="false">'
    + '<span class="badge">皮肤</span><span class="hint">按住拖拽旋转</span></div>'
    + '<div class="meta"><div class="nm">' + esc(r.name || "未命名") + ' <span>· ' + esc(r.uploader || "匿名") + '</span></div>'
    + '<div class="tm">' + fmtTime(r.createdAt) + '</div>'
    + '<button class="gbadge" data-grp="' + esc(r.id) + '" title="点击调整分组（需管理密码）">' + esc(grpName(r.group)) + ' ▾</button>'
    + '<button class="stbadge ' + (r.added ? "on" : "off") + '" data-st="' + esc(r.id) + '" title="点击切换加入状态（需管理密码）">' + (r.added ? "已加入" : "未加入") + '</button></div>'
    + '<div class="ops"><button class="btn small blue" data-copy="' + esc(r.id) + '">复制链接</button>'
    + '<button class="btn small blue" data-copyurl="' + esc(r.id) + '">复制2D链接</button>'
    + '<button class="btn small blue" data-dl="' + esc(r.id) + '">下载</button>'
    + '<button class="btn small danger" data-del="' + esc(r.id) + '">删除</button></div>'
    + '</div>';
}
var copyClicks = {};  /* 卡片id -> 最近点击时间戳 */
var editLock = 0;      /* 编辑复制完成后的锁定时间戳（防误覆盖剪贴板） */
var genBusy = {};      /* 卡片id -> 等待中的 resolve 列表（防重复生成） */

/* 确保该皮肤有换肤指令链接：已有 uuid 直接用；没有则现场调用 MineSkin 生成并保存 */
function ensureLink(rec){
  return new Promise(function(resolve){
    if(rec.uuid){
      resolve('/skin url "https://minesk.in/' + rec.uuid + '"');
      return;
    }
    if(genBusy[rec.id]){ genBusy[rec.id].push(resolve); return; }
    genBusy[rec.id] = [resolve];
    toast("正在生成换肤指令，请稍后…");
    generateSkinCmd(GH.raw("skins/" + encodeURIComponent(rec.file)), rec.variant || "classic", "").then(function(skin){
      rec.uuid = skin.uuid;
      state.data.updatedAt = Date.now();
      saveWithRetry(0);
      var cmd = '/skin url "https://minesk.in/' + skin.uuid + '"';
      genBusy[rec.id].forEach(function(f){ f(cmd); });
      delete genBusy[rec.id];
    }).catch(function(e){
      genBusy[rec.id].forEach(function(f){ f(null); });
      delete genBusy[rec.id];
    });
  });
}

document.getElementById("skinGrid").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-copy]");
  if(!btn) return;
  var id = btn.dataset.copy;
  var rec = null;
  (state.data.skins || []).forEach(function(r){ if(r.id === id) rec = r; });
  if(!rec) return;
  var raw = GH.raw("skins/" + encodeURIComponent(rec.file));
  /* 快速连续点击 4 次 → 进入管理编辑复制内容 */
  var now = Date.now();
  var arr = copyClicks[id] || (copyClicks[id] = []);
  arr.push(now);
  while(arr.length && arr[0] < now - 2000) arr.shift();
  if(arr.length >= 4){
    copyClicks[id] = [];
    ensureLink(rec).then(function(link){
      var pw = prompt("编辑复制内容需要管理密码：");
      if(pw === null) return;
      if(pw !== DELETE_PW){ toast("密码错误，无法编辑", true); return; }
      var edited = prompt("密码已验证，可手动编辑要复制的内容：", link || raw);
      if(edited === null){ toast("已取消编辑，剪贴板内容未变"); return; }
      copyText(edited).then(function(){
        toast("已复制编辑后的内容（请直接粘贴）");
        editLock = Date.now();
      }, function(){ toast("复制失败，请手动复制", true); });
    });
    return;
  }
  if(Date.now() - editLock < 4000){
    toast("刚完成编辑复制，剪贴板已是编辑后的内容，请直接粘贴");
    return;
  }
  ensureLink(rec).then(function(link){
    if(link){
      copyText(link).then(function(){ toast("已复制换肤指令"); }, function(){ toast("复制失败，请手动复制", true); });
    }else{
      copyText(raw).then(function(){ toast("换肤指令生成失败，已复制下载链接，可稍后重试"); }, function(){ toast("复制失败，请手动复制", true); });
    }
  });
});

    /* 跨域回退：先拉成 blob 再触发下载 */

      setTimeout(function(){ URL.revokeObjectURL(u); document.body.removeChild(a2); }, 1200);

document.getElementById("fileInput").addEventListener("change", function(){
  var f = this.files && this.files[0];
  if(!f) return;
  if(f.type !== "image/png"){
    toast("请选择 PNG 格式的皮肤文件", true);
    this.value = ""; return;
  }
  var url = URL.createObjectURL(f);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    var w = img.naturalWidth, h = img.naturalHeight;
    if((w === 64 && h === 64) || (w === 64 && h === 32)){
      pendingFile = f; pendingDim = w + "×" + h;
      document.getElementById("upPreviewImg").src = url;
      document.getElementById("upPreviewInfo").textContent = "已识别：64×64 / " + f.name + "（" + Math.round(f.size/1024) + " KB）";
      document.getElementById("upPreview").style.display = "block";
    } else {
      toast("皮肤尺寸必须是 64×64 或 64×32，当前是 " + w + "×" + h, true);
      document.getElementById("fileInput").value = "";
    }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast("无法读取该图片", true); document.getElementById("fileInput").value = ""; };
  img.src = url;
});

/* ===== MineSkin 换肤命令生成（SkinsRestorer /skin url）===== */
function mineSkinQueue(url, variant, name){
  /* MineSkin 的 name 参数只接受 ASCII，中文名会触发 400，故不传 name（仅作显示用，不影响生成的 UUID） */
  var payload = JSON.stringify({ url: url, variant: variant || "classic" });
  return new Promise(function(resolve, reject){
    var attempt = 0;
    function once(){
      fetch("https://api.mineskin.org/v2/queue", {
        method: "POST", headers: { "User-Agent": "SkinGallery/1.0", "Content-Type": "application/json" }, body: payload
      }).then(function(r){
        return r.text().then(function(t){
          var data;
          try{ data = JSON.parse(t); }catch(e){ data = null; }
          if(!r.ok){
            if(r.status === 429) throw new Error("MineSkin 请求太频繁，请稍等 1 分钟再试");
            var msg = "";
            if(data && data.error) msg = data.error;
            else if(data && data.errors) msg = data.errors.map(function(er){ return er.message || er; }).join("; ");
            throw new Error("MineSkin 拒绝上传(" + r.status + ")" + (msg ? "：" + msg : "，请确认是 64×64/64×32 的标准皮肤 PNG"));
          }
          if(!data || !data.job){
            throw new Error(data && data.error ? data.error : "MineSkin 无任务返回");
          }
          resolve(data.job.id);
        });
      }).catch(function(e){
        if(attempt < 5){
          attempt++;
          setTimeout(once, 4000);
        } else {
          reject(e);
        }
      });
    }
    once();
  });
}
function mineSkinPoll(jobId, cb){
  var tries = 0;
  function once(){
    fetch("https://api.mineskin.org/v2/queue/" + jobId, { headers: { "User-Agent": "SkinGallery/1.0" } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.skin && d.job && d.job.status === "completed"){
          cb(null, d.skin);
        } else if(d.job && d.job.status === "failed"){
          cb(new Error("MineSkin 处理失败"));
        } else if(++tries > 60){
          cb(new Error("生成超时，请点击重试"));
        } else {
          setTimeout(once, 1500);
        }
      })
      .catch(function(e){ if(++tries > 60) cb(e); else setTimeout(once, 1500); });
  }
  once();
}
function generateSkinCmd(file, variant, name){
  return new Promise(function(resolve, reject){
    mineSkinQueue(file, variant, name).then(function(jobId){
      mineSkinPoll(jobId, function(err, skin){
        if(err) reject(err);
        else resolve(skin);
      });
    }).catch(reject);
  });
}
function showCmdState(txt, meta, showRetry){
  var t = document.getElementById("cmdText");
  var m = document.getElementById("cmdMeta");
  var c = document.getElementById("cmdCopy");
  var r = document.getElementById("cmdRetry");
  var w = document.getElementById("cmdWrap");
  t.textContent = txt;
  m.textContent = meta || "";
  c.disabled = !meta || meta.indexOf("已生成") === -1;
  r.style.display = showRetry ? "flex" : "none";
  w.style.display = "block";
}

document.getElementById("upConfirm").addEventListener("click", function(){
  if(!pendingFile){ toast("请先选择皮肤文件", true); return; }
  var name = document.getElementById("upName").value.trim();
  var uploader = document.getElementById("upUploader").value.trim();
  if(!name){ toast("请填写皮肤名字", true); return; }
  if(!uploader){ toast("请填写上传人", true); return; }
  var variant = (document.querySelector('input[name="upVariant"]:checked') || {}).value || "classic";
  var btn = this;
  btn.disabled = true;
  showLoad(true);
  showCmdState("正在上传皮肤…", "", false);
  var fr = new FileReader();
  fr.onload = function(){
    var s = String(fr.result);
    var i = s.indexOf("base64,");
    var b64 = i >= 0 ? s.slice(i + 7) : s;
    var fname = Date.now() + "_" + Math.floor(Math.random() * 999) + ".png";
    var group = document.getElementById("upGroup").value || "";
    var rec = { id: "skin" + Date.now(), file: fname, name: name, uploader: uploader, createdAt: Date.now(), variant: variant, group: group };
    GH.putSkin(fname, b64).then(function(){
      state.data.skins.push(rec);
      state.data.updatedAt = Date.now();
      return saveWithRetry(0);
    }).then(function(){
      showLoad(false);
      toast("皮肤「" + name + "」已上传" + (group === GROUP_PLAYER ? "到玩家皮肤征集" : "") + "，正在同步数据…");
      state._cb = Date.now();
      var gtab = tabOfGroup(group);
      if(gtab !== "all" && activeTab !== gtab){
        activeTab = gtab;
        document.querySelectorAll("#groupTabs .tab").forEach(function(x){
          x.classList.toggle("active", x.dataset.tab === gtab);
        });
      }
      renderGrid();
      pendingRawUrl = GH.raw("skins/" + encodeURIComponent(fname));
      showCmdState("同步数据中请稍后", "", false);
      generateSkinCmd(pendingRawUrl, variant, name).then(function(skin){
        rec.uuid = skin.uuid;
        state.data.updatedAt = Date.now();
        saveWithRetry(0);
        showCmdState('/skin url "https://minesk.in/' + skin.uuid + '"', "已生成，复制后在游戏聊天框发送即可换肤", false);
        toast("换肤命令已生成！");
      }).catch(function(err){
        showCmdState("命令生成失败：" + err.message + "。可点击下方重新生成，或手动前往 SkinsRestorer 上传", "", true);
        toast("命令生成失败，已自动重试 5 次", true);
      });
    }).catch(function(err){
      showLoad(false);
      btn.disabled = false;
      showCmdState("上传失败：" + err.message, "", true);
      toast("上传失败：" + err.message, true);
    });
  };
  fr.onerror = function(){ showLoad(false); btn.disabled = false; toast("读取文件失败", true); };
  fr.readAsDataURL(pendingFile);
});

    document.getElementById(btn.getAttribute("data-close")).classList.remove("show");
  });
});
document.querySelectorAll(".mask").forEach(function(mask){
  mask.addEventListener("click", function(e){
    if(e.target === mask) mask.classList.remove("show");
  });
});

/* ===== 卡片内嵌 3D 渲染（Skinview3D，SkinsRestorer 同款）===== */
var viewers = [];       /* {canvas, viewer} */
var MAX_VIEWERS = 8;    /* 浏览器 WebGL context 并发上限 */
var curAnim = "idle";
var io = null;
var DELETE_PW = "wd198114+";  /* 删除皮肤需输入的管理密码 */

function makeAnim(type){
  var A = skinview3d;
  switch(type){
    case "walk": return new A.WalkingAnimation();
    case "run": return new A.RunningAnimation();
    case "crouch": return new A.CrouchAnimation();
    default: return new A.IdleAnimation();
  }
}
var skinCacheMem = {};  /* 内存缓存：file -> dataURL */
/* 皮肤图片持久缓存：首次从仓库下载并存 localStorage，之后本地直接读取（零网络请求） */
function skinDataUrl(file){
  var key = "skinv3:" + file;
  return new Promise(function(resolve){
    if(skinCacheMem[file]){ resolve(skinCacheMem[file]); return; }
    var ls = null;
    try{ ls = localStorage.getItem(key); }catch(e){}
    if(ls){ skinCacheMem[file] = ls; resolve(ls); return; }
    var url = GH.raw("skins/" + encodeURIComponent(file));
    fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
      var fr = new FileReader();
      fr.onload = function(){
        var d = String(fr.result);
        skinCacheMem[file] = d;
        try{ localStorage.setItem(key, d); }catch(e){}
        resolve(d);
      };
      fr.readAsDataURL(blob);
    }).catch(function(){ resolve(url); });
  });
}
function initCardViewer(canvas){
  var url = canvas.getAttribute("data-url");
  var file = url.split("/").pop();
  var ph = canvas.parentNode;
  var fb = ph.querySelector(".fallback");
  var entry = null;
  /* 皮肤图片走持久缓存（首次下载后本地直接读取），3D 与 2D 共用同一份数据 */
  skinDataUrl(file).then(function(d){
    if(!canvas.isConnected) return;
    if(fb){
      fb.onload = function(){ if(fb && fb.dataset.hide !== "1") fb.style.display = "block"; };
      fb.onerror = function(){};
      fb.src = d;
    }
    var viewer = null;
    try{
      viewer = new skinview3d.SkinViewer({
        canvas: canvas,
        width: canvas.clientWidth || 220,
        height: canvas.clientHeight || 220,
        background: 0x4a4a4a,
        fov: 38,
        animation: makeAnim(curAnim)
      });
      viewer.autoRotate = true;
      viewer.autoRotateSpeed = 0.8;
    }catch(e){ viewer = null; }
    if(!viewer || !viewer.renderer || !viewer.renderer.getContext()){
      try{ if(viewer) viewer.dispose(); }catch(e){}
      return;
    }
    viewer.loadSkin(d).then(function(){
      entry.loaded = true;
      if(fb){ fb.style.display = "none"; fb.dataset.hide = "1"; }
    }).catch(function(){
      /* 3D 加载失败：保留 2D 图 */
    });
    entry.viewer = viewer;
    entry.loaded = false;
  });
  entry = { canvas: canvas, viewer: null, loaded: false };
  viewers.push(entry);
  return entry;
}
function pauseEntry(entry){ try{ entry.viewer.paused = true; }catch(e){} }
function resumeEntry(entry){ try{ entry.viewer.paused = false; }catch(e){} }
function disposeEntry(entry){
  try{ entry.viewer.dispose(); }catch(e){}
  var i = viewers.indexOf(entry);
  if(i > -1) viewers.splice(i, 1);
}
function disposeAllRenderers(){ while(viewers.length) disposeEntry(viewers[0]); }
function observeCards(){
  if(!io && typeof IntersectionObserver !== "undefined"){
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        var canvas = en.target;
        var entry = null;
        for(var i = 0; i < viewers.length; i++){
          if(viewers[i].canvas === canvas){ entry = viewers[i]; break; }
        }
        if(en.isIntersecting){
          if(entry){
            resumeEntry(entry);
          } else {
            /* 超限时回收最早创建且离开视口的 */
            if(viewers.length >= MAX_VIEWERS){
              var oldest = null;
              for(var k = 0; k < viewers.length; k++){
                var r = viewers[k];
                if(r.canvas.getBoundingClientRect().top > window.innerHeight || r.canvas.getBoundingClientRect().bottom < 0){
                  oldest = r; break;
                }
              }
              if(oldest) disposeEntry(oldest);
              else disposeEntry(viewers[0]);
            }
            initCardViewer(canvas);
          }
        } else if(entry){
          pauseEntry(entry);
        }
      });
    }, { rootMargin: "120px" });
  }
  document.querySelectorAll("#skinGrid .ph canvas").forEach(function(canvas){
    if(io) io.observe(canvas);
  });
}
document.getElementById("animSel").addEventListener("change", function(){
  curAnim = this.value;
  viewers.forEach(function(v){ v.viewer.animation = makeAnim(curAnim); });
});
